<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="/frontend/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <div class="bg"></div>
        <div class="forum">
            <div class="logo-wrapper">
                <a href="#"><img src="/frontend/assets/logo.png" alt="logo" class="logo"></a>
                <h5>GoTravels</h5>
            </div>
            <h1>Get Started</h1>
            <form action="#">
                <div>
                    <Label class="label">Name</Label>
                    <input type="text" placeholder="JohnDoe" class="input">
                </div>
                <div>
                    <Label class="label">Email</Label>
                    <input type="email" placeholder="John420@gmail.com" class="input">
                </div>
                <div>
                    <Label class="label">Password</Label>
                    <input type="password" placeholder="John@420" class="input">
                </div>
                <div>
                    <input type="submit" value="Login" class="input submit">
                </div>
            </form>
        </div>
    </main>
</body>

</html>
