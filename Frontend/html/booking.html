<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking - GoTravels</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f7fa;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-top: 0;
        }

        .service-info {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #e63946;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #c92f3b;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Book Your Journey</h1>

    <div class="container">

        <div class="card">

            <h2>Travel Details</h2>

            <div id="serviceInfo" class="service-info">
                Loading travel details...
            </div>

            <form id="bookingForm">

                <label for="user_id">User ID</label>
                <input
                    type="number"
                    id="user_id"
                    placeholder="Enter your User ID"
                    required
                >

                <label for="passenger_count">
                    Number of Passengers
                </label>

                <input
                    type="number"
                    id="passenger_count"
                    min="1"
                    value="1"
                    required
                >

                <button type="submit">
                    Continue Booking
                </button>

            </form>

            <div id="message" class="message"></div>

        </div>

    </div>

    <script src="/frontend/js/booking.js"></script>

</body>
</html>
